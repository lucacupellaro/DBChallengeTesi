# ============================================================
# Pipeline configuration — parametri sperimentali
# ============================================================

# Parallelismo globale Flink (asse x delle curve di scaling)
flink.parallelism=12

# Intervallo di checkpoint in ms (costo dello stato)
checkpoint.interval.ms=60000

# Abilita/disabilita chiamata al server ML (isolamento bottleneck)
ml.enabled=true

# Max richieste ML asincrone in volo
ml.async.capacity=20

# Timeout singola richiesta ML in secondi
ml.async.timeout.s=30

# Parallelismo del sink JDBC (separato dal globale)
sink.jdbc.parallelism=4

# Kafka partitions — valore di riferimento per tracciabilità esperimenti.
# ATTENZIONE: modificare qui NON cambia le partizioni Kafka.
# Per applicarlo: cambiare KAFKA_NUM_PARTITIONS in docker-compose.yml
# e ricreare il topic (docker compose down -v && docker compose up -d).
kafka.partitions=8
